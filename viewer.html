<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Browser — STL / 3MF / OBJ / PLY Viewer</title>
<style>
  :root{
    --blue:#0052CC; --blue-dark:#003D99; --bg:#1b1d23; --panel:#23262e;
    --panel-2:#2b2f39; --border:#3a3f4b; --text:#e6e9ef; --sub:#9aa3b2;
    --accent:#4c9aff; --orange:#ff8b00;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text);
  }
  #canvas-wrap{position:fixed; inset:0;}
  canvas{display:block;}

  .topbar{
    position:fixed; top:0; left:0; right:0; z-index:10;
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    padding:8px 12px; background:rgba(27,29,35,.82); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);
  }
  .topbar .brand{font-weight:600; font-size:15px; margin-right:4px; white-space:nowrap;}
  .topbar .brand a{color:var(--accent); text-decoration:none;}
  .topbar .spacer{flex:1;}
  button, .filebtn, select{
    font:inherit; font-size:13px; color:var(--text);
    background:var(--panel-2); border:1px solid var(--border);
    padding:6px 11px; border-radius:7px; cursor:pointer;
  }
  button:hover,.filebtn:hover,select:hover{border-color:var(--accent);}
  button.active{background:var(--blue); border-color:var(--blue); color:#fff;}
  .filebtn{display:inline-flex; align-items:center; gap:6px;}
  input[type=file]{display:none;}
  input[type=color]{width:30px; height:30px; padding:0; border:1px solid var(--border);
    border-radius:6px; background:none; cursor:pointer;}
  label.inline{font-size:12px; color:var(--sub); display:inline-flex; align-items:center; gap:5px;}

  .info{
    position:fixed; left:12px; bottom:12px; z-index:10;
    background:rgba(35,38,46,.9); border:1px solid var(--border);
    border-radius:10px; padding:12px 14px; font-size:12px; max-width:280px;
  }
  .info h3{font-size:12px; color:var(--sub); text-transform:uppercase;
    letter-spacing:.05em; margin-bottom:6px; font-weight:600;}
  .info .row{display:flex; justify-content:space-between; gap:14px; padding:2px 0;}
  .info .row span:first-child{color:var(--sub);}
  .info .row span:last-child{font-variant-numeric:tabular-nums;}

  .controls-legend{
    position:fixed; right:12px; bottom:12px; z-index:10;
    background:rgba(35,38,46,.9); border:1px solid var(--border);
    border-radius:10px; padding:10px 12px; font-size:11.5px; color:var(--sub);
  }
  .controls-legend b{color:var(--text);}
  .controls-legend .k{
    display:inline-block; background:var(--panel-2); border:1px solid var(--border);
    border-radius:4px; padding:0 5px; color:var(--text); font-size:11px;
  }

  .drop-hint{
    position:fixed; inset:0; z-index:5; display:none;
    align-items:center; justify-content:center; pointer-events:none;
    background:rgba(0,82,204,.18); border:3px dashed var(--accent);
  }
  .drop-hint.show{display:flex;}
  .drop-hint div{font-size:22px; font-weight:600; color:#fff;
    background:rgba(0,82,204,.85); padding:16px 28px; border-radius:12px;}

  #toast{
    position:fixed; top:64px; left:50%; transform:translateX(-50%); z-index:20;
    background:var(--panel); border:1px solid var(--border); color:var(--text);
    padding:9px 16px; border-radius:8px; font-size:13px; opacity:0;
    transition:opacity .25s; pointer-events:none; max-width:80vw; text-align:center;
  }
  #toast.show{opacity:1;}
  #toast.err{border-color:#ff5630; color:#ff9c8a;}

  #marquee{position:fixed; z-index:13; border:1.5px dashed var(--accent);
    background:rgba(76,154,255,.14); pointer-events:none; display:none;}
  #marquee.sub{border-color:#ff6b6b; background:rgba(255,107,107,.14);}
  .rev{font-size:11px; font-weight:700; letter-spacing:.02em; background:var(--panel-2);
    border:1px solid var(--border); color:var(--sub); padding:4px 9px; border-radius:11px;
    white-space:nowrap; text-decoration:none;}
  .rev:hover{border-color:var(--accent); color:var(--text);}

  /* editor toolbox (left rail) */
  .toolbox{
    position:fixed; left:12px; top:64px; z-index:12;
    display:flex; flex-direction:column; gap:6px;
    background:rgba(35,38,46,.92); border:1px solid var(--border);
    border-radius:12px; padding:7px;
  }
  .toolbox button{
    width:40px; height:40px; padding:0; font-size:18px; line-height:1;
    display:flex; align-items:center; justify-content:center; position:relative;
  }
  .toolbox button .kbd{
    position:absolute; right:2px; bottom:1px; font-size:9px; color:var(--sub);
  }
  .toolbox .sep{height:1px; background:var(--border); margin:2px 2px;}
  .toolbox button.del{color:#ff8a8a;}

  /* mode HUD */
  #hud{
    position:fixed; top:60px; left:50%; transform:translateX(-50%); z-index:11;
    background:rgba(0,82,204,.9); color:#fff; border-radius:8px;
    padding:7px 14px; font-size:12.5px; opacity:0; transition:opacity .2s;
    pointer-events:none; white-space:nowrap; max-width:92vw;
  }
  #hud.show{opacity:1;}
  #hud b{background:rgba(255,255,255,.22); padding:1px 6px; border-radius:4px;}

  /* floating measurement labels */
  .ruler-label{
    position:fixed; z-index:9; transform:translate(-50%,-50%);
    background:rgba(20,22,28,.92); border:1px solid #ffd43b; color:#ffe08a;
    font-size:12px; font-variant-numeric:tabular-nums; padding:2px 7px;
    border-radius:6px; pointer-events:none; white-space:nowrap;
  }
  .ruler-label.sel{border-color:#ff6b6b; color:#ffb3b3; box-shadow:0 0 0 2px rgba(255,107,107,.4);}
  .ruler-label.preview{opacity:.9; border-style:dashed;}
</style>
</head>
<body>
<div id="canvas-wrap"></div>

<div class="topbar">
  <span class="brand"><a href="index.html">🖨️ 3D Print Tools</a> · Browser</span>
  <label class="filebtn">📂 Open file
    <input type="file" id="file" accept=".stl,.3mf,.obj,.ply,.gltf,.glb,.gcode">
  </label>
  <select id="sample" title="Load a bundled sample">
    <option value="">Samples…</option>
    <option value="samples/2x2_ver1.3mf">2x2_ver1.3mf</option>
    <option value="builtin:overhang">▲ Test overhang (built-in)</option>
    <option value="builtin:dumbbell">▦ Test sub-face (built-in)</option>
  </select>
  <span class="spacer"></span>
  <button id="fit">Fit</button>
  <button id="reset">Reset view</button>
  <button id="wire">Wireframe</button>
  <button id="grid" class="active">Grid</button>
  <button id="axes" class="active">Axes</button>
  <label class="inline">Color <input type="color" id="color" value="#8ab4ff"></label>
  <label class="inline">BG <input type="color" id="bgcolor" value="#1b1d23"></label>
  <button id="inverse" title="Inverse / negative — carve the shape out of its bounding block (Ctrl+I)">🔃 Inverse</button>
  <select id="chop" title="Chop with an X/Y/Z plane through the centre, keeping one flush half">
    <option value="">Chop…</option>
    <option value="x-">✂ X − half</option>
    <option value="x+">✂ X + half</option>
    <option value="y-">✂ Y − half</option>
    <option value="y+">✂ Y + half</option>
    <option value="z-">✂ Z − half</option>
    <option value="z+">✂ Z + half</option>
  </select>
  <button id="save3mf" title="Save the current mesh as .3mf">💾 .3mf</button>
  <button id="savestl" title="Save the current mesh as .stl">.stl</button>
  <a class="rev" href="https://github.com/borenw/3d-print-tools/commits/main" target="_blank" title="Inverse (Ctrl+I) + X/Y/Z chop planes">rev 11</a>
</div>

<div class="info" id="info">
  <h3>Model</h3>
  <div class="row"><span>File</span><span id="i-name">—</span></div>
  <div class="row"><span>Triangles</span><span id="i-tris">—</span></div>
  <div class="row"><span>Size X</span><span id="i-x">—</span></div>
  <div class="row"><span>Size Y</span><span id="i-y">—</span></div>
  <div class="row"><span>Size Z</span><span id="i-z">—</span></div>
</div>

<div class="toolbox" id="toolbox">
  <button id="t-view" class="active" title="Select / Orbit (Esc)">✋</button>
  <button id="t-move" title="Move a flat face — click a surface, drag an axis to push/pull (M)">✥<span class="kbd">M</span></button>
  <button id="t-obj" title="Select object — click a part; a weakly-attached blob is chopped at its narrowest neck (O)">🧩<span class="kbd">O</span></button>
  <button id="t-draw" title="Draw a rectangle on a surface, then Enter to cut/add it (R)">📐<span class="kbd">R</span></button>
  <button id="t-ruler" title="Ruler — click a start surface, then an end point (K)">📏<span class="kbd">K</span></button>
  <div class="sep"></div>
  <button id="t-pushmode" title="Face push/pull: EXTRUDE builds new walls and leaves the rest of the mesh untouched (default); STRETCH deforms the attached faces">⬆<span class="kbd" id="pushmode-lbl">EXT</span></button>
  <button id="t-cutadd" title="Draw mode: CUT subtracts, ADD unions (right-click while drawing to toggle)">✂️<span class="kbd" id="cutadd-lbl">CUT</span></button>
  <button id="t-del" class="del" title="Delete selected ruler / object (Del)">🗑</button>
</div>

<div id="hud"></div>

<div class="controls-legend">
  <div><span class="k">L-drag</span> orbit &nbsp; <span class="k">Mid-drag</span> pan &nbsp; <span class="k">Wheel</span> zoom</div>
  <div style="margin-top:4px;"><span class="k">M</span> move · <span class="k">O</span> object · <span class="k">R</span> draw · <span class="k">K</span> ruler · <span class="k">⌘Z</span> undo · <span class="k">⌘C/V/X</span></div>
</div>

<div class="drop-hint" id="drophint"><div>Drop STL / 3MF / OBJ / PLY here</div></div>
<div id="marquee"></div>
<div id="toast"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "fflate": "https://cdn.jsdelivr.net/npm/fflate@0.8.2/esm/browser.js",
    "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.7.8/build/index.module.js",
    "three-bvh-csg": "https://cdn.jsdelivr.net/npm/three-bvh-csg@0.0.16/build/index.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import { ThreeMFLoader } from 'three/addons/loaders/3MFLoader.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';
import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';
import { unzipSync, strFromU8, zipSync, strToU8 } from 'fflate';
import { Brush, Evaluator, ADDITION, SUBTRACTION } from 'three-bvh-csg';

// ---------- scene ----------
const wrap = document.getElementById('canvas-wrap');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
wrap.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1b1d23);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100000);
camera.up.set(0,0,1);           // Z-up, matches 3D-printing convention
camera.position.set(120,-160,110);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
// Slicer/CAD-intuitive mapping: left orbit, MIDDLE pan (drag), right pan, wheel zoom
controls.mouseButtons = {
  LEFT: THREE.MOUSE.ROTATE,
  MIDDLE: THREE.MOUSE.PAN,
  RIGHT: THREE.MOUSE.PAN
};
controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };

// lights
scene.add(new THREE.HemisphereLight(0xffffff, 0x404050, 1.1));
const key = new THREE.DirectionalLight(0xffffff, 1.4); key.position.set(1,-1,2); scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.5); fill.position.set(-1,1,0.5); scene.add(fill);

// grid + axes (on XY plane, Z up)
let grid = new THREE.GridHelper(200, 20, 0x4c9aff, 0x333844);
grid.rotation.x = Math.PI/2;
scene.add(grid);
let axes = new THREE.AxesHelper(60); scene.add(axes);

let currentObject = null;
let currentName = 'model';
let currentMesh = null, currentGeometry = null;
let spanScale = 100;                 // ~model size, used to scale gizmos/pick tolerances
const material = new THREE.MeshStandardMaterial({
  color:0x8ab4ff, roughness:0.55, metalness:0.0, side:THREE.DoubleSide, flatShading:false
});

// ---------- helpers ----------
const toastEl = document.getElementById('toast');
let toastTimer;
function toast(msg, isErr){
  toastEl.textContent = msg;
  toastEl.classList.toggle('err', !!isErr);
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toastEl.classList.remove('show'), isErr?5000:2600);
}

function fmt(n){ return (Math.round(n*100)/100).toLocaleString(); }

function clearObject(){
  if(currentObject){
    scene.remove(currentObject);
    currentObject.traverse(o=>{ if(o.geometry) o.geometry.dispose(); });
    currentObject = null;
  }
}

// Collect all mesh geometries in world space into a single BufferGeometry
function mergeToGeometry(root){
  root.updateMatrixWorld(true);
  const geos = [];
  root.traverse(o=>{
    if(o.isMesh && o.geometry){
      const g = o.geometry.clone();
      g.applyMatrix4(o.matrixWorld);
      // strip attributes other than position/normal so merge doesn't fail
      const keep = new THREE.BufferGeometry();
      keep.setAttribute('position', g.getAttribute('position'));
      if(g.index) keep.setIndex(g.index);
      geos.push(keep.toNonIndexed());
    }
  });
  if(!geos.length) return null;
  const merged = BufferGeometryUtils.mergeGeometries(geos, false);
  merged.computeVertexNormals();
  return merged;
}

function displayGeometry(geometry, name){
  clearObject();
  geometry.computeBoundingBox();
  const box = geometry.boundingBox;
  const size = new THREE.Vector3(); box.getSize(size);
  const center = new THREE.Vector3(); box.getCenter(center);

  // sit the model on the plate (z=0), centered over origin in XY
  geometry.translate(-center.x, -center.y, -box.min.z);

  const mesh = new THREE.Mesh(geometry, material);
  currentObject = new THREE.Group();
  currentObject.add(mesh);
  scene.add(currentObject);
  currentMesh = mesh; currentGeometry = geometry;
  currentName = (name||'model').replace(/\.[^.]+$/,'').replace(/[^\w\-]+/g,'_') || 'model';
  spanScale = Math.max(size.x, size.y, size.z, 10);
  if(typeof onModelLoaded === 'function') onModelLoaded(size);

  // info
  const tris = geometry.getAttribute('position').count / 3;
  document.getElementById('i-name').textContent = name || '—';
  document.getElementById('i-tris').textContent = fmt(tris);
  document.getElementById('i-x').textContent = fmt(size.x)+' mm';
  document.getElementById('i-y').textContent = fmt(size.y)+' mm';
  document.getElementById('i-z').textContent = fmt(size.z)+' mm';

  // scale grid to model
  const span = Math.max(size.x, size.y, 40);
  fitGridTo(span);
  frameObject(size);
}

function fitGridTo(span){
  const div = Math.max(10, Math.round(span/10)*2);
  const s = Math.ceil(span*1.6/10)*10;
  scene.remove(grid);
  grid = new THREE.GridHelper(s, Math.max(10, Math.round(s/10)), 0x4c9aff, 0x333844);
  grid.rotation.x = Math.PI/2;
  grid.visible = document.getElementById('grid').classList.contains('active');
  scene.add(grid);
}

function frameObject(size){
  camAnim=null; camera.up.set(0,0,1);      // restore Z-up (a flatten may have changed it)
  const maxDim = Math.max(size.x, size.y, size.z, 10);
  const dist = maxDim * 2.1;
  controls.target.set(0,0,size.z/2);
  camera.position.set(dist*0.7, -dist*0.9, dist*0.7 + size.z/2);
  camera.near = maxDim/100; camera.far = maxDim*50;
  camera.updateProjectionMatrix();
  controls.update();
}

// ---------- loading ----------
function loaderFor(ext){
  switch(ext){
    case 'stl': return { type:'geometry', loader:new STLLoader() };
    case '3mf': return { type:'group', loader:new ThreeMFLoader() };
    case 'obj': return { type:'group-str', loader:new OBJLoader() };
    case 'ply': return { type:'geometry', loader:new PLYLoader() };
    case 'gltf':
    case 'glb': return { type:'gltf', loader:new GLTFLoader() };
    case 'gcode':
    case 'gco':
    case 'g': return { type:'gcode' };
    default: return null;
  }
}

// ---------- robust 3MF mesh parser (handles the production extension:
//            meshes referenced across separate 3D/Objects/*.model files) ----------
const _CORE='http://schemas.microsoft.com/3dmanufacturing/core/2015/02';
const _PROD='http://schemas.microsoft.com/3dmanufacturing/production/2015/06';
function parse3MFMeshes(buffer){
  let files; try{ files=unzipSync(new Uint8Array(buffer)); }catch(e){ return null; }
  const dp=new DOMParser(); const cache={};
  function getModel(path){
    path=(path||'').replace(/^\//,''); if(!path) return null;
    if(cache[path]!==undefined) return cache[path];
    const data=files[path] || files[Object.keys(files).find(k=>k.toLowerCase()===path.toLowerCase())];
    if(!data){ return cache[path]=null; }
    const doc=dp.parseFromString(strFromU8(data),'application/xml');
    const objects={}; const objEls=doc.getElementsByTagNameNS(_CORE,'object');
    for(let i=0;i<objEls.length;i++) objects[objEls[i].getAttribute('id')]=objEls[i];
    return cache[path]={doc,objects};
  }
  function mat(s){ const m=new THREE.Matrix4(); if(!s) return m;
    const v=s.trim().split(/\s+/).map(Number); if(v.length<12) return m;
    m.set(v[0],v[3],v[6],v[9], v[1],v[4],v[7],v[10], v[2],v[5],v[8],v[11], 0,0,0,1); return m; }
  function pathOf(el){ return el.getAttributeNS(_PROD,'path') || el.getAttribute('p:path') || null; }
  const geos=[];
  function emit(model, objEl, xform){
    const meshes=objEl.getElementsByTagNameNS(_CORE,'mesh');
    if(meshes.length){
      const mesh=meshes[0];
      const vs=mesh.getElementsByTagNameNS(_CORE,'vertex');
      const ts=mesh.getElementsByTagNameNS(_CORE,'triangle');
      if(vs.length>2 && ts.length){
        const vx=new Float64Array(vs.length*3);
        for(let i=0;i<vs.length;i++){ vx[i*3]=+vs[i].getAttribute('x'); vx[i*3+1]=+vs[i].getAttribute('y'); vx[i*3+2]=+vs[i].getAttribute('z'); }
        const pos=new Float32Array(ts.length*9);
        for(let i=0;i<ts.length;i++){ const t=ts[i];
          const A=+t.getAttribute('v1'),B=+t.getAttribute('v2'),C=+t.getAttribute('v3'); const o=i*9;
          pos[o]=vx[A*3];pos[o+1]=vx[A*3+1];pos[o+2]=vx[A*3+2];
          pos[o+3]=vx[B*3];pos[o+4]=vx[B*3+1];pos[o+5]=vx[B*3+2];
          pos[o+6]=vx[C*3];pos[o+7]=vx[C*3+1];pos[o+8]=vx[C*3+2]; }
        const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(pos,3));
        g.applyMatrix4(xform); geos.push(g);
      }
      return;
    }
    const comps=objEl.getElementsByTagNameNS(_CORE,'component');
    for(let i=0;i<comps.length;i++){ const cp=comps[i];
      const cid=cp.getAttribute('objectid'); const cpath=pathOf(cp);
      const cm=cpath?getModel(cpath):model;
      if(cm && cm.objects[cid]) emit(cm, cm.objects[cid], xform.clone().multiply(mat(cp.getAttribute('transform'))));
    }
  }
  const root=getModel('3D/3dmodel.model'); if(!root) return null;
  const items=root.doc.getElementsByTagNameNS(_CORE,'item');
  for(let i=0;i<items.length;i++){ const it=items[i];
    const oid=it.getAttribute('objectid'); const ipath=pathOf(it);
    const m=ipath?getModel(ipath):root;
    if(m && m.objects[oid]) emit(m, m.objects[oid], mat(it.getAttribute('transform')));
  }
  if(!geos.length){                       // no resolvable build items — grab any mesh we can find
    for(const path in files){ if(!/\.model$/i.test(path)) continue; const m=getModel(path);
      if(m) for(const id in m.objects) emit(m, m.objects[id], new THREE.Matrix4());
      if(geos.length) break; }
  }
  if(!geos.length) return null;
  const merged=geos.length>1?BufferGeometryUtils.mergeGeometries(geos,false):geos[0];
  if(!merged) return null;
  merged.computeVertexNormals();
  return merged;
}

// ---------- G-code toolpath fallback ----------
function tryGcodeFrom3MF(buffer, filename){
  try{
    const files = unzipSync(new Uint8Array(buffer));
    // pick the largest *.gcode entry (the real plate toolpath)
    let bestName=null, bestLen=-1;
    for(const name in files){ if(/\.gcode$/i.test(name) && files[name].length>bestLen){ bestName=name; bestLen=files[name].length; } }
    if(!bestName) return false;
    displayGcode(strFromU8(files[bestName]), filename+' › '+bestName.split('/').pop());
    toast('No mesh in this .3mf — showing its G-code toolpath instead');
    return true;
  }catch(e){ console.error(e); return false; }
}

function parseGcode(text){
  let x=0,y=0,z=0,e=0; let absXYZ=true;
  // default E mode: relative if the file uses M83 anywhere (Bambu/Prusa/Flash), else absolute
  let absE = !/^\s*M83\b/mi.test(text);
  const pos=[]; let minx=1e9,miny=1e9,minz=1e9,maxx=-1e9,maxy=-1e9,maxz=-1e9, layers=0, lastLayerZ=null;
  const lines=text.split('\n');
  for(let li=0; li<lines.length; li++){
    let s=lines[li]; const sc=s.indexOf(';'); if(sc>=0) s=s.slice(0,sc);
    s=s.trim(); if(!s) continue;
    const p=s.split(/\s+/); const cmd=p[0].toUpperCase();
    if(cmd==='M82'){ absE=true; continue; }
    if(cmd==='M83'){ absE=false; continue; }
    if(cmd==='G90'){ absXYZ=true; continue; }
    if(cmd==='G91'){ absXYZ=false; continue; }
    if(cmd==='G92'){ for(let i=1;i<p.length;i++){ const c=p[i][0].toUpperCase(), v=parseFloat(p[i].slice(1));
      if(isNaN(v))continue; if(c==='E')e=v; else if(c==='X')x=v; else if(c==='Y')y=v; else if(c==='Z')z=v; } continue; }
    if(cmd==='G0'||cmd==='G1'){
      let nx=x,ny=y,nz=z, ne=e, hasE=false;
      for(let i=1;i<p.length;i++){ const c=p[i][0].toUpperCase(), v=parseFloat(p[i].slice(1)); if(isNaN(v))continue;
        if(c==='X') nx=absXYZ?v:x+v; else if(c==='Y') ny=absXYZ?v:y+v; else if(c==='Z') nz=absXYZ?v:z+v;
        else if(c==='E'){ ne=absE?v:e+v; hasE=true; } }
      const de = hasE ? ne-e : 0;
      const moved = (nx!==x||ny!==y||nz!==z);
      if(de>1e-6 && moved){                    // extrusion segment
        pos.push(x,y,z, nx,ny,nz);
        minx=Math.min(minx,x,nx); maxx=Math.max(maxx,x,nx);
        miny=Math.min(miny,y,ny); maxy=Math.max(maxy,y,ny);
        minz=Math.min(minz,z,nz); maxz=Math.max(maxz,z,nz);
        if(nz!==lastLayerZ){ layers++; lastLayerZ=nz; }
      }
      x=nx;y=ny;z=nz; if(hasE) e=ne;
      if(pos.length>6000000) break;             // safety cap (~1M segments)
    }
  }
  return { pos, bbox:{minx,miny,minz,maxx,maxy,maxz}, layers };
}

function displayGcode(text, name){
  const g=parseGcode(text);
  if(!g.pos.length){ toast('No extrusion moves found in G-code', true); return; }
  clearObject();
  const b=g.bbox; const cx=(b.minx+b.maxx)/2, cy=(b.miny+b.maxy)/2;
  const sizeX=b.maxx-b.minx, sizeY=b.maxy-b.miny, sizeZ=b.maxz-b.minz;
  const geo=new THREE.BufferGeometry();
  const arr=new Float32Array(g.pos.length);
  for(let i=0;i<g.pos.length;i+=3){ arr[i]=g.pos[i]-cx; arr[i+1]=g.pos[i+1]-cy; arr[i+2]=g.pos[i+2]-b.minz; }
  geo.setAttribute('position', new THREE.BufferAttribute(arr,3));
  // color by layer height (blue → cyan → orange)
  const col=new Float32Array(g.pos.length); const zr=Math.max(sizeZ,1e-6); const c=new THREE.Color();
  for(let i=0;i<arr.length;i+=3){ const t=arr[i+2]/zr; c.setHSL(0.62-0.62*t, 0.75, 0.55);
    col[i]=c.r; col[i+1]=c.g; col[i+2]=c.b; }
  geo.setAttribute('color', new THREE.BufferAttribute(col,3));
  const seg=new THREE.LineSegments(geo, new THREE.LineBasicMaterial({vertexColors:true}));
  currentObject=new THREE.Group(); currentObject.add(seg); scene.add(currentObject);
  currentMesh=null; currentGeometry=null;                  // editor tools operate on meshes only
  spanScale=Math.max(sizeX,sizeY,sizeZ,10);
  if(typeof onModelLoaded==='function') onModelLoaded();

  document.getElementById('i-name').textContent=name;
  document.getElementById('i-tris').textContent=fmt(g.pos.length/2)+' segs · '+g.layers+' layers';
  document.getElementById('i-x').textContent=fmt(sizeX)+' mm';
  document.getElementById('i-y').textContent=fmt(sizeY)+' mm';
  document.getElementById('i-z').textContent=fmt(sizeZ)+' mm';
  fitGridTo(Math.max(sizeX,sizeY,40));
  frameObject(new THREE.Vector3(sizeX,sizeY,sizeZ));
  toast('G-code toolpath: '+g.layers+' layers, '+fmt(g.pos.length/2)+' segments');
}

function loadArrayBuffer(buffer, filename){
  const ext = filename.split('.').pop().toLowerCase();
  const spec = loaderFor(ext);
  if(!spec){ toast('Unsupported format: .'+ext, true); return; }
  try{
    if(spec.type === 'geometry'){
      const geo = spec.loader.parse(buffer);
      displayGeometry(geo.toNonIndexed ? geo.toNonIndexed() : geo, filename);
    } else if(spec.type === 'group'){
      // custom parser first (handles inline + production-extension external meshes)
      let merged = parse3MFMeshes(buffer);
      if(!merged){ try{ merged = mergeToGeometry(spec.loader.parse(buffer)); }catch(_){ merged=null; } }
      if(!merged){
        // Some slicer .3mf files (e.g. Bambu/Flash Studio sliced projects) carry
        // no mesh — only a G-code toolpath. Fall back to rendering that.
        if(tryGcodeFrom3MF(buffer, filename)) return;
        toast('This .3mf has no 3D mesh (sliced/G-code-only project). Re-save it as a mesh 3MF or STL.', true);
        return;
      }
      displayGeometry(merged, filename);
    } else if(spec.type === 'group-str'){
      const text = new TextDecoder().decode(buffer);
      const group = spec.loader.parse(text);
      const merged = mergeToGeometry(group);
      if(!merged){ toast('No mesh found in file', true); return; }
      displayGeometry(merged, filename);
    } else if(spec.type === 'gltf'){
      spec.loader.parse(buffer, '', (gltf)=>{
        const merged = mergeToGeometry(gltf.scene);
        if(!merged){ toast('No mesh found in glTF', true); return; }
        displayGeometry(merged, filename);
      }, (e)=>{ console.error(e); toast('Failed to parse glTF', true); });
    } else if(spec.type === 'gcode'){
      displayGcode(new TextDecoder().decode(buffer), filename);
    }
    saveLast(buffer, filename);           // remember for next visit
    toast('Loaded '+filename);
  }catch(e){
    console.error(e);
    toast('Failed to load '+filename+' — '+e.message, true);
  }
}

function loadFromFile(file){
  const reader = new FileReader();
  reader.onload = ()=> loadArrayBuffer(reader.result, file.name);
  reader.onerror = ()=> toast('Could not read file', true);
  reader.readAsArrayBuffer(file);
}

async function loadFromURL(url){
  try{
    const res = await fetch(url);
    if(!res.ok) throw new Error('HTTP '+res.status);
    const buf = await res.arrayBuffer();
    loadArrayBuffer(buf, url.split('/').pop());
  }catch(e){
    toast('Could not fetch '+url+' (open via http, not file://)', true);
  }
}

const dom = renderer.domElement;
const rc = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();

function faceNormal(p0,p1,p2,out){
  const ux=p1.x-p0.x,uy=p1.y-p0.y,uz=p1.z-p0.z, vx=p2.x-p0.x,vy=p2.y-p0.y,vz=p2.z-p0.z;
  out.set(uy*vz-uz*vy, uz*vx-ux*vz, ux*vy-uy*vx).normalize(); return out;
}
function setNDC(px,py){ ndc.x=(px/dom.clientWidth)*2-1; ndc.y=-(py/dom.clientHeight)*2+1; }
function worldToScreenLocal(v){ const p=v.clone().project(camera);
  return { x:(p.x*0.5+0.5)*dom.clientWidth, y:(-p.y*0.5+0.5)*dom.clientHeight, z:p.z }; }
function worldToScreenPage(v){ const p=v.clone().project(camera); const r=dom.getBoundingClientRect();
  return { x:r.left+(p.x*0.5+0.5)*r.width, y:r.top+(-p.y*0.5+0.5)*r.height, z:p.z }; }
function makeTangents(N,T1,T2){
  const ref = Math.abs(N.z)<0.9 ? new THREE.Vector3(0,0,1) : new THREE.Vector3(1,0,0);
  T1.crossVectors(ref,N).normalize(); T2.crossVectors(N,T1).normalize();
}
function raycastModel(px,py){ if(!currentMesh) return null;
  setNDC(px,py); rc.setFromCamera(ndc,camera); return rc.intersectObject(currentMesh,false)[0]||null; }

let selection=null, highlightMesh=null;
const keyOf=(x,y,z)=>Math.round(x*1000)+'_'+Math.round(y*1000)+'_'+Math.round(z*1000);
function triNormal(pos,t,out){ const i=t*3;
  a.fromBufferAttribute(pos,i); b.fromBufferAttribute(pos,i+1); c.fromBufferAttribute(pos,i+2);
  return faceNormal(a,b,c,out); }

// gather the coplanar face (all triangles on the same plane as the clicked one)
function gatherCoplanar(faceIndex){
  const pos=currentGeometry.getAttribute('position');
  const N=new THREE.Vector3(); triNormal(pos,faceIndex,N);
  a.fromBufferAttribute(pos, faceIndex*3); const D=N.dot(a);
  const normTol=0.996, dTol=Math.max(0.02, spanScale*0.003);
  const tmp=new THREE.Vector3(), tris=[]; const nTris=pos.count/3;
  for(let t=0;t<nTris;t++){
    triNormal(pos,t,tmp);
    if(tmp.dot(N) < normTol) continue;
    a.fromBufferAttribute(pos,t*3);
    if(Math.abs(N.dot(a)-D) > dTol) continue;
    tris.push(t);
  }
  const T1=new THREE.Vector3(), T2=new THREE.Vector3(); makeTangents(N,T1,T2);
  return {tris,N,D,T1,T2};
}
// commit a face-triangle set as the current push/pull selection
function applyFaceSelection(tris, N, T1, T2){
  const pos=currentGeometry.getAttribute('position');
  const keys=new Set(); const centroid=new THREE.Vector3(); let cc=0;
  for(const t of tris){ for(let k=0;k<3;k++){ a.fromBufferAttribute(pos,t*3+k);
    keys.add(keyOf(a.x,a.y,a.z)); centroid.add(a); cc++; } }
  centroid.multiplyScalar(1/cc);
  const stretchIdx=[];                      // welded: moving these deforms attached faces (mode A)
  for(let i=0;i<pos.count;i++){ a.fromBufferAttribute(pos,i);
    if(keys.has(keyOf(a.x,a.y,a.z))) stretchIdx.push(i); }
  const faceIdx=[];                          // only this face's own verts (mode B / extrude)
  for(const t of tris) faceIdx.push(t*3, t*3+1, t*3+2);
  const boundary=faceBoundaryEdges(tris);    // perimeter edges → where new walls go
  selection={ tris, stretchIdx, faceIdx, boundary, origArray:Float32Array.from(pos.array), anchor:centroid.clone(), kind:'face' };
  gizmoProxy.position.copy(centroid);
  gizmoProxy.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(T1,T2,N));
  tc.setSpace('local'); tc.visible=true; tc.enabled=true;
  buildHighlight();
  updateHud();
}
function buildSelection(faceIndex){        // level-0 helper (used by tests)
  const g=gatherCoplanar(faceIndex); applyFaceSelection(g.tris, g.N, g.T1, g.T2);
}

let faceWork=null;                 // {allTris,N,T1,T2} — the coplanar face being edited
let camAnim=null;                  // smooth flatten-to-face camera animation
function selectFaceAt(px,py){
  const hit=raycastModel(px,py);
  if(!hit){ clearSelection(); return; }
  const g=gatherCoplanar(hit.faceIndex);
  faceWork={allTris:g.tris, N:g.N.clone(), T1:g.T1.clone(), T2:g.T2.clone()};
  applyFaceSelection(g.tris, g.N, g.T1, g.T2);
  flattenToFace(g.N, g.T2, selection.anchor.clone());
  toast(g.tris.length+' tris selected · rotating head-on — Ctrl+drag adds, Shift+drag removes a rectangle');
}
// animate the camera to look straight down the face normal (planar view)
function flattenToFace(N, T2, centroid){
  const dist=Math.max(camera.position.distanceTo(controls.target), spanScale*0.9);
  camera.up.copy(T2);              // tangent → never degenerate, keeps the face upright-ish
  camAnim={ fp:camera.position.clone(), tp:centroid.clone().addScaledVector(N,dist),
            ft:controls.target.clone(), tt:centroid.clone(), t:0 };
}

// ---------- marquee sub-selection (Ctrl=add, Shift=remove), snapped to strong edges ----------
let marquee=null;
const marqueeEl=document.getElementById('marquee');
function computeStrongPts(){                 // endpoints of sharp / boundary edges
  if(!currentGeometry) return [];
  const pos=currentGeometry.getAttribute('position'); if(pos.count>200000) return [];
  const topo=buildTopo(); const nrm=[]; const n=new THREE.Vector3();
  for(let t=0;t<topo.nT;t++){ triNormal(pos,t,n); nrm.push(n.clone()); }
  const seen=new Set(), pts=[];
  const add=(id)=>{ if(!seen.has(id)){ seen.add(id); pts.push(topo.weldPos[id]); } };
  for(const [k,tris] of topo.edgeTris){
    const strong = tris.length!==2 || nrm[tris[0]].angleTo(nrm[tris[1]])>Math.PI/6;
    if(!strong) continue;
    const i=k.indexOf('|'); add(+k.slice(0,i)); add(+k.slice(i+1));
  }
  return pts;
}
function snapScreen(px,py){                   // snap to nearest strong-edge point, with auto-backoff
  if(!marquee || !marquee.snapOn || !marquee.pts.length) return {x:px,y:py};
  let best=null, bd=Math.max(12, dom.clientWidth*0.013);
  for(const p of marquee.pts){ const s=worldToScreenLocal(p); const d=Math.hypot(s.x-px,s.y-py);
    if(d<bd){ bd=d; best=s; } }
  if(best){ marquee.wasSnap=true; return {x:best.x, y:best.y}; }
  if(marquee.wasSnap){ marquee.wasSnap=false; if(++marquee.escapes>=3){ marquee.snapOn=false;
    toast('Edge snapping off for this selection'); } }
  return {x:px,y:py};
}
function startMarquee(px,py,ctrl){
  if(!faceWork){ return false; }
  controls.enabled=false;
  marquee={mode:ctrl?'add':'sub', pts:computeStrongPts(), snapOn:true, wasSnap:false, escapes:0};
  const s=snapScreen(px,py); marquee.x0=s.x; marquee.y0=s.y; marquee.x1=s.x; marquee.y1=s.y;
  marqueeEl.className = ctrl?'':'sub'; drawMarquee(); return true;
}
function moveMarquee(px,py){ if(!marquee) return; const s=snapScreen(px,py); marquee.x1=s.x; marquee.y1=s.y; drawMarquee(); }
function drawMarquee(){
  const r=dom.getBoundingClientRect();
  const x0=Math.min(marquee.x0,marquee.x1), y0=Math.min(marquee.y0,marquee.y1);
  marqueeEl.style.display='block';
  marqueeEl.style.left=(r.left+x0)+'px'; marqueeEl.style.top=(r.top+y0)+'px';
  marqueeEl.style.width=Math.abs(marquee.x1-marquee.x0)+'px'; marqueeEl.style.height=Math.abs(marquee.y1-marquee.y0)+'px';
}
function endMarquee(){
  if(!marquee) return; controls.enabled=true; marqueeEl.style.display='none';
  const x0=Math.min(marquee.x0,marquee.x1),x1=Math.max(marquee.x0,marquee.x1);
  const y0=Math.min(marquee.y0,marquee.y1),y1=Math.max(marquee.y0,marquee.y1);
  if(x1-x0>3 && y1-y0>3 && faceWork){
    const pos=currentGeometry.getAttribute('position'); const sel=new Set(selection?selection.tris:[]);
    const cen=new THREE.Vector3();
    for(const t of faceWork.allTris){
      a.fromBufferAttribute(pos,t*3);b.fromBufferAttribute(pos,t*3+1);c.fromBufferAttribute(pos,t*3+2);
      cen.set((a.x+b.x+c.x)/3,(a.y+b.y+c.y)/3,(a.z+b.z+c.z)/3);
      const s=worldToScreenLocal(cen);
      if(s.x>=x0&&s.x<=x1&&s.y>=y0&&s.y<=y1){ marquee.mode==='add'?sel.add(t):sel.delete(t); }
    }
    if(sel.size) applyFaceSelection([...sel], faceWork.N, faceWork.T1, faceWork.T2);
    else { clearSelection(); faceWork=null; toast('Selection emptied'); }
    if(sel.size) toast((marquee.mode==='add'?'Added to':'Removed from')+' selection — '+sel.size+' tris');
  }
  marquee=null;
}
let pushMode='extrude';                    // 'extrude' (B, default) | 'stretch' (A)

// perimeter edges of a triangle set, as pairs of original-position Vector3s
function faceBoundaryEdges(tris){
  const pos=currentGeometry.getAttribute('position');
  const vkey=(vi)=>{ a.fromBufferAttribute(pos,vi); return keyOf(a.x,a.y,a.z); };
  const ek=(u,v)=> u<v ? u+'|'+v : v+'|'+u;
  const count=new Map(), rep=new Map();
  for(const t of tris){ const vi=[t*3,t*3+1,t*3+2]; const kk=vi.map(vkey);
    for(let e=0;e<3;e++){ const key=ek(kk[e],kk[(e+1)%3]);
      count.set(key,(count.get(key)||0)+1);
      if(!rep.has(key)) rep.set(key,[new THREE.Vector3().fromBufferAttribute(pos,vi[e]),
                                     new THREE.Vector3().fromBufferAttribute(pos,vi[(e+1)%3])]); } }
  const edges=[]; for(const [key,c] of count) if(c===1) edges.push(rep.get(key));
  return edges;
}
let wallMesh=null;
function updateWalls(disp){
  const edges=selection.boundary;
  if(!edges || !edges.length){ removeWalls(); return; }
  const need=edges.length*18;
  if(!wallMesh || wallMesh.geometry.getAttribute('position').array.length!==need){
    removeWalls();
    const g=new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(need),3));
    wallMesh=new THREE.Mesh(g, material); currentObject.add(wallMesh);
  }
  const arr=wallMesh.geometry.getAttribute('position').array; let w=0;
  const An=new THREE.Vector3(), Bn=new THREE.Vector3();
  for(const [A,B] of edges){ An.copy(A).add(disp); Bn.copy(B).add(disp);
    arr[w++]=A.x;arr[w++]=A.y;arr[w++]=A.z; arr[w++]=B.x;arr[w++]=B.y;arr[w++]=B.z; arr[w++]=Bn.x;arr[w++]=Bn.y;arr[w++]=Bn.z;
    arr[w++]=A.x;arr[w++]=A.y;arr[w++]=A.z; arr[w++]=Bn.x;arr[w++]=Bn.y;arr[w++]=Bn.z; arr[w++]=An.x;arr[w++]=An.y;arr[w++]=An.z; }
  wallMesh.geometry.getAttribute('position').needsUpdate=true; wallMesh.geometry.computeVertexNormals();
}

// ---------- object select (connectivity) + auto-chop at narrowest neck ----------
// Build a welded topology (shared-position vertices) so we can flood-fill
// connected components and sweep for the thinnest cross-section.
function buildTopo(){
  const pos=currentGeometry.getAttribute('position'); const nV=pos.count, nT=nV/3;
  const map=new Map(); const weldPos=[]; const weld=new Int32Array(nV);
  for(let i=0;i<nV;i++){ a.fromBufferAttribute(pos,i); const k=keyOf(a.x,a.y,a.z);
    let id=map.get(k); if(id===undefined){ id=weldPos.length; weldPos.push(a.clone()); map.set(k,id); } weld[i]=id; }
  const triW=new Int32Array(nT*3);
  for(let t=0;t<nT*3;t++) triW[t]=weld[t];
  const edgeTris=new Map();
  const ek=(u,v)=> u<v ? u+'|'+v : v+'|'+u;
  const addE=(u,v,t)=>{ const k=ek(u,v); let arr=edgeTris.get(k); if(!arr){arr=[];edgeTris.set(k,arr);} arr.push(t); };
  for(let t=0;t<nT;t++){ const A=triW[t*3],B=triW[t*3+1],C=triW[t*3+2]; addE(A,B,t);addE(B,C,t);addE(C,A,t); }
  return {weldPos,triW,edgeTris,nT};
}
function componentOf(topo,startTri,blocked){
  const seen=new Uint8Array(topo.nT); const stack=[startTri]; seen[startTri]=1; const out=[startTri];
  while(stack.length){ const t=stack.pop();
    const A=topo.triW[t*3],B=topo.triW[t*3+1],C=topo.triW[t*3+2];
    const es=[[A,B],[B,C],[C,A]];
    for(const [u,v] of es){ const k=u<v?u+'|'+v:v+'|'+u; if(blocked&&blocked.has(k)) continue;
      const arr=topo.edgeTris.get(k); if(!arr) continue;
      for(const nt of arr){ if(!seen[nt]){ seen[nt]=1; out.push(nt); stack.push(nt); } } } }
  return out;
}
function findChop(topo,P){
  // unique welded edges with lengths
  const edges=[];
  for(const [k] of topo.edgeTris){ const i=k.indexOf('|'); const u=+k.slice(0,i), v=+k.slice(i+1);
    edges.push({u,v,len:topo.weldPos[u].distanceTo(topo.weldPos[v])}); }
  const axesList=[new THREE.Vector3(1,0,0),new THREE.Vector3(0,1,0),new THREE.Vector3(0,0,1)];
  let best=null;
  for(const A of axesList){
    const proj=topo.weldPos.map(p=>p.dot(A));
    let mn=Infinity,mx=-Infinity; for(const v of proj){ if(v<mn)mn=v; if(v>mx)mx=v; }
    const span=mx-mn; if(span<1e-3) continue;
    const pP=P.dot(A); const STEPS=64; const costs=[];
    for(let i=1;i<STEPS;i++){ const s=mn+span*i/STEPS;
      let cost=0; for(const e of edges){ if((proj[e.u]<s)!==(proj[e.v]<s)) cost+=e.len; }
      let cntL=0; for(const v of proj){ if(v<s) cntL++; }
      costs.push({s,cost,cntL,total:proj.length,pLeft:pP<s});
    }
    const sortedC=costs.map(c=>c.cost).slice().sort((x,y)=>x-y);
    const med=sortedC[Math.floor(sortedC.length/2)]||1;
    for(const c of costs){
      if(c.cost<=1e-6) continue;
      const minority=Math.min(c.cntL,c.total-c.cntL);
      if(minority<3) continue;
      const pOnSmall=(c.pLeft?c.cntL:c.total-c.cntL)<=c.total/2;
      const score=c.cost*(pOnSmall?1:1.6);
      if(c.cost < 0.5*med && (!best||score<best.score)) best={axis:A,s:c.s,cost:c.cost,score};
    }
  }
  if(!best) return null;
  const blocked=new Set(); const proj=topo.weldPos.map(p=>p.dot(best.axis));
  for(const [k] of topo.edgeTris){ const i=k.indexOf('|'); const u=+k.slice(0,i), v=+k.slice(i+1);
    if((proj[u]<best.s)!==(proj[v]<best.s)) blocked.add(k); }
  return {blocked,cost:best.cost};
}
function selectObjectAt(px,py){
  const hit=raycastModel(px,py); if(!hit){ clearSelection(); return; }
  if(currentGeometry.getAttribute('position').count/3 > 120000){
    toast('Mesh too large for object chop', true); return; }
  const topo=buildTopo();
  const comp=componentOf(topo, hit.faceIndex, null);
  if(comp.length < topo.nT){ setObjectSelection(comp);
    toast('Selected a standalone object ('+comp.length+' triangles)'); return; }
  const cut=findChop(topo, hit.point);
  if(!cut){ setObjectSelection(comp); toast('No clear neck found — selected the whole body'); return; }
  const blob=componentOf(topo, hit.faceIndex, cut.blocked);
  if(blob.length>=topo.nT){ setObjectSelection(comp); toast('Cut did not separate — whole body'); return; }
  setObjectSelection(blob);
  toast('Chopped at narrowest neck — '+blob.length+' triangles, cut ≈ '+cut.cost.toFixed(1)+' mm. Drag to detach, Del to remove.');
}
function setObjectSelection(tris){

// ---------- ruler ----------
const rulers=[]; let rulerPhase=0, rulerFrame=null, preview=null, selectedRuler=null;

function distPointToLine(p,a2,b2){
  const vx=b2.x-a2.x, vy=b2.y-a2.y, wx=p.x-a2.x, wy=p.y-a2.y;
  const L2=vx*vx+vy*vy; if(L2<1e-6) return Math.hypot(wx,wy);
  return Math.abs(wx*vy-wy*vx)/Math.sqrt(L2);
}
function closestParamOnLine(O,Dr,P,u){       // param t on line P+u*t closest to ray O+Dr*s
  const w0x=P.x-O.x,w0y=P.y-O.y,w0z=P.z-O.z;
  const A=Dr.dot(Dr), B=Dr.x*u.x+Dr.y*u.y+Dr.z*u.z, C=u.dot(u);
  const Dp=Dr.x*w0x+Dr.y*w0y+Dr.z*w0z, E=u.x*w0x+u.y*w0y+u.z*w0z;
  const den=A*C-B*B; if(Math.abs(den)<1e-9) return E/C;
  return (A*E-B*Dp)/den;
}
function rulerEnd(px,py){
  const S=rulerFrame.S;
  setNDC(px,py); rc.setFromCamera(ndc,camera);
  const O=rc.ray.origin, Dr=rc.ray.direction;
  const axes=[{d:rulerFrame.T1,l:'X'},{d:rulerFrame.T2,l:'Y'},{d:rulerFrame.N,l:'Z'}];
  const mouse={x:px,y:py}; const s0=worldToScreenLocal(S);
  let best=null;
  for(const ax of axes){
    const s1=worldToScreenLocal(S.clone().addScaledVector(ax.d, spanScale));
    const dpx=distPointToLine(mouse,s0,s1);
    if(!best||dpx<best.dpx) best={ax,dpx};
  }
  const SNAP=Math.max(14, dom.clientWidth*0.012);
  if(best && best.dpx<SNAP){
    const t=closestParamOnLine(O,Dr,S,best.ax.d);
    return { end:S.clone().addScaledVector(best.ax.d, t), axis:best.ax.l };
  }
  const fwd=camera.getWorldDirection(new THREE.Vector3());
  const den=Dr.dot(fwd);
  let end;
  if(Math.abs(den)<1e-6) end=S.clone();
  else { const t=(S.clone().sub(O)).dot(fwd)/den; end=O.clone().addScaledVector(Dr,t); }
  return { end, axis:null };
}
function labelText(dist,axis){ return (axis?axis+' ':'')+dist.toFixed(2)+' mm'; }

function rulerClick(px,py){
  if(rulerPhase===0){
    const hit=raycastModel(px,py);
    if(!hit){ toast('Click on the model surface to start the ruler', true); return; }
    const N=new THREE.Vector3(); triNormal(currentGeometry.getAttribute('position'), hit.faceIndex, N);
    const T1=new THREE.Vector3(), T2=new THREE.Vector3(); makeTangents(N,T1,T2);
    rulerFrame={ S:hit.point.clone(), T1, T2, N };
    rulerPhase=1; makePreview(); updateHud();
  } else {
    const {end,axis}=rulerEnd(px,py);
    pushUndo();
    addRuler(rulerFrame.S.clone(), end, axis);
    rulerPhase=0; rulerFrame=null; removePreview(); updateHud();
  }
}
function addRuler(S,E,axis){
  const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints([S,E]),
    new THREE.LineBasicMaterial({color:0xffd43b, depthTest:false}));
  line.renderOrder=3;
  const sph=()=>new THREE.Mesh(new THREE.SphereGeometry(spanScale*0.012,10,8),
    new THREE.MeshBasicMaterial({color:0xffd43b, depthTest:false}));
  const s1=sph(); s1.position.copy(S); const s2=sph(); s2.position.copy(E);
  s1.renderOrder=s2.renderOrder=3;
  const grp=new THREE.Group(); grp.add(line,s1,s2); scene.add(grp);
  const el=document.createElement('div'); el.className='ruler-label'; document.body.appendChild(el);
  const dist=S.distanceTo(E); el.textContent=labelText(dist,axis);
  rulers.push({grp,line,el,S:S.clone(),E:E.clone(),dist,axis});
  toast('Ruler placed: '+dist.toFixed(2)+' mm'+(axis?' along '+axis:' (free)'));
}
function makePreview(){
  removePreview();
  const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints([rulerFrame.S, rulerFrame.S.clone()]),
    new THREE.LineBasicMaterial({color:0xffd43b, depthTest:false})); line.renderOrder=3;
  scene.add(line);
  const el=document.createElement('div'); el.className='ruler-label preview'; document.body.appendChild(el);
  preview={line,el,S:rulerFrame.S.clone(),E:rulerFrame.S.clone(),axis:null};
}
function updatePreview(px,py){
  if(!preview) return;
  const {end,axis}=rulerEnd(px,py); preview.E.copy(end); preview.axis=axis;
  const p=preview.line.geometry.getAttribute('position');
  p.setXYZ(0, preview.S.x,preview.S.y,preview.S.z); p.setXYZ(1, end.x,end.y,end.z); p.needsUpdate=true;
  preview.el.textContent=labelText(preview.S.distanceTo(end),axis);
}
function removePreview(){ if(preview){ scene.remove(preview.line); preview.line.geometry.dispose();
  preview.line.material.dispose(); preview.el.remove(); preview=null; } }

function selectRulerAt(px,py){

let snapEnabled=true, snapPts=null, snapWasOn=false, snapEscapes=0, snapMarker=null;
function snapPx(){ return Math.max(12, dom.clientWidth*0.013); }
function buildSnapPts(){
  snapPts=null; if(!currentGeometry) return;
  const pos=currentGeometry.getAttribute('position'); if(pos.count>120000) return;   // too many to scan per move
  const seen=new Set(), pts=[];
  for(let i=0;i<pos.count;i++){ a.fromBufferAttribute(pos,i);
    const k=Math.round(a.x*20)+'_'+Math.round(a.y*20)+'_'+Math.round(a.z*20);
    if(!seen.has(k)){ seen.add(k); pts.push(a.clone()); } }

}
function resetSnap(){ snapEnabled=true; snapWasOn=false; snapEscapes=0; buildSnapPts(); }
function snapCorner(raw, px, py){
  if(!snapEnabled || !snapPts){ showSnapMarker(null); return raw; }
  let best=null, bd=snapPx();
  for(const c of snapPts){ const s=worldToScreenLocal(c); const d=Math.hypot(s.x-px, s.y-py);
    if(d<bd){ bd=d; best=c; } }
  if(best){
    const {P,N}=drawStart;                          // keep the corner on the draw plane
    const p=best.clone().sub(N.clone().multiplyScalar(best.clone().sub(P).dot(N)));
    snapWasOn=true; showSnapMarker(p); return p;
  }
  if(snapWasOn){ snapWasOn=false; if(++snapEscapes>=3){ snapEnabled=false;
    toast('Snapping off for this rectangle (you kept moving off it)'); } }
  showSnapMarker(null); return raw;
}
function showSnapMarker(p){
  if(!p){ if(snapMarker) snapMarker.visible=false; return; }
  if(!snapMarker){ snapMarker=new THREE.Mesh(new THREE.SphereGeometry(1,12,10),
    new THREE.MeshBasicMaterial({color:0x00e5ff, depthTest:false})); snapMarker.renderOrder=6; scene.add(snapMarker); }
  snapMarker.scale.setScalar(spanScale*0.012); snapMarker.position.copy(p); snapMarker.visible=true;
}

function rectCorners(){
  const {P,T1,T2}=drawStart;
  const uA=rectA.clone().sub(P).dot(T1), vA=rectA.clone().sub(P).dot(T2);
  const uB=rectB.clone().sub(P).dot(T1), vB=rectB.clone().sub(P).dot(T2);
  const u0=Math.min(uA,uB),u1=Math.max(uA,uB),v0=Math.min(vA,vB),v1=Math.max(vA,vB);
  const mk=(u,v)=>P.clone().addScaledVector(T1,u).addScaledVector(T2,v);
  return {corner:[mk(u0,v0),mk(u1,v0),mk(u1,v1),mk(u0,v1)], u0,u1,v0,v1};
}
function buildRectLine(){ removeRectLine();
  rectLine=new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(
    [drawStart.P,drawStart.P,drawStart.P,drawStart.P]),
    new THREE.LineBasicMaterial({color:drawMode==='cut'?0xff5555:0x55dd77, depthTest:false}));
  rectLine.renderOrder=4; scene.add(rectLine); }
function updateRectLine(){ if(!rectLine) return; const c=rectCorners().corner;
  const p=rectLine.geometry.getAttribute('position'); for(let i=0;i<4;i++) p.setXYZ(i,c[i].x,c[i].y,c[i].z); p.needsUpdate=true; }
function removeRectLine(){ if(rectLine){ scene.remove(rectLine); rectLine.geometry.dispose(); rectLine.material.dispose(); rectLine=null; } }

function buildBoxGeo(){
  const {P,N,T1,T2}=drawStart; const R=rectCorners();
  const cu=(R.u0+R.u1)/2, cv=(R.v0+R.v1)/2, w=R.u1-R.u0, d=R.v1-R.v0;
  const base=P.clone().addScaledVector(T1,cu).addScaledVector(T2,cv);
  let nHi,nLo;
  if(drawMode==='add'){ nHi=Math.max(spanScale*0.15, Math.min(w,d)*0.6); nLo=-0.3; }
  else {                                   // cut: from just above the surface down through the model
    const pos=currentGeometry.getAttribute('position'); let mn=1e9;
    for(let i=0;i<pos.count;i++){ a.fromBufferAttribute(pos,i); const pj=a.clone().sub(base).dot(N); if(pj<mn)mn=pj; }
    nHi=1; nLo=mn-1;
  }
  const geo=new THREE.BoxGeometry(w,d,nHi-nLo);
  const basis=new THREE.Matrix4().makeBasis(T1,T2,N);
  basis.setPosition(base.clone().addScaledVector(N,(nHi+nLo)/2));
  geo.applyMatrix4(basis); geo.computeVertexNormals();
  return geo;
}
function rebuildPending(){
  removeBoxPreview(); pendingBox=buildBoxGeo();
  boxPreview=new THREE.Mesh(pendingBox, new THREE.MeshStandardMaterial({
    color:drawMode==='cut'?0xff5555:0x55dd77, transparent:true, opacity:0.45, side:THREE.DoubleSide }));
  scene.add(boxPreview);
}
function removeBoxPreview(){ if(boxPreview){ scene.remove(boxPreview); boxPreview.material.dispose(); boxPreview=null; }
  if(pendingBox){ pendingBox.dispose?.(); pendingBox=null; } }
function cancelDraw(){ removeRectLine(); removeBoxPreview(); showSnapMarker(null); drawStage=0; drawStart=null; updateHud(); }

function drawDown(e){
  if(e.button!==0 || drawStage!==0) return;
  const r=dom.getBoundingClientRect(); const px=e.clientX-r.left, py=e.clientY-r.top;
  const hit=raycastModel(px,py);
  if(!hit){ toast('Click a surface to start the rectangle', true); return; }
  const N=new THREE.Vector3(); triNormal(currentGeometry.getAttribute('position'), hit.faceIndex, N);
  const T1=new THREE.Vector3(), T2=new THREE.Vector3(); makeTangents(N,T1,T2);
  drawStart={P:hit.point.clone(),N,T1,T2};
  resetSnap();
  const p0=snapCorner(hit.point.clone(), px, py);
  drawStart.P=p0.clone(); rectA=p0.clone(); rectB=p0.clone();
  drawStage=1; buildRectLine(); updateHud();
}
function drawMoveEvt(e){
  if(drawStage!==1) return;
  const r=dom.getBoundingClientRect(); const px=e.clientX-r.left, py=e.clientY-r.top;
  setNDC(px,py); rc.setFromCamera(ndc,camera);
  const p=rayPlane(rc.ray.origin, rc.ray.direction, drawStart.P, drawStart.N); if(!p) return;
  rectB=snapCorner(p, px, py); updateRectLine();
}
function drawUp(e){
  if(e.button!==0 || drawStage!==1) return;
  const dsp=rectB.clone().sub(rectA);
  if(Math.abs(dsp.dot(drawStart.T1))<spanScale*0.01 || Math.abs(dsp.dot(drawStart.T2))<spanScale*0.01){
    cancelDraw(); toast('Rectangle too small — try again', true); return; }
  drawStage=3; rebuildPending();
  applyDraw();                       // apply the cut/add immediately on release
}
function applyDraw(){
  if(drawStage!==3 || !pendingBox || !currentMesh){ return; }
  pushUndo();
  try{
    const A=new Brush(currentGeometry); A.updateMatrixWorld();
    const B=new Brush(pendingBox); B.updateMatrixWorld();
    const res=csgEval.evaluate(A,B, drawMode==='cut'?SUBTRACTION:ADDITION);
    const ng=res.geometry.clone(); ng.computeVertexNormals(); ng.computeBoundingBox();
    currentMesh.geometry.dispose(); currentMesh.geometry=ng; currentGeometry=ng;
    updateDims(); updateTris();
    toast((drawMode==='cut'?'Cut':'Added')+' — mesh now '+fmt(ng.getAttribute('position').count/3)+' triangles');
  }catch(err){ console.error(err); toast('Boolean failed: '+err.message, true); undo(); }
  cancelDraw();
}

// ---------- pointer + keyboard ----------
let downPos=null, downTime=0;
dom.addEventListener('pointerdown', e=>{
  if(mode==='draw'){ drawDown(e); return; }
  if(mode==='move' && selection && e.button===0 && (e.shiftKey||e.ctrlKey||e.metaKey)){
    const r=dom.getBoundingClientRect(); if(startMarquee(e.clientX-r.left, e.clientY-r.top, e.ctrlKey||e.metaKey)) return; }
  if(e.button!==0) return; downPos={x:e.clientX,y:e.clientY}; downTime=performance.now(); });
dom.addEventListener('pointerup', e=>{
  if(marquee){ endMarquee(); return; }
  if(mode==='draw'){ drawUp(e); return; }
  if(e.button!==0) return;
  const wasDrag=justDragged; justDragged=false;
  const start=downPos; downPos=null;
  if(wasDrag || !start) return;
  if(Math.hypot(e.clientX-start.x, e.clientY-start.y) > 6) return;   // a camera drag, not a click
  if(performance.now()-downTime > 500) return;
  const r=dom.getBoundingClientRect(); const px=e.clientX-r.left, py=e.clientY-r.top;
  if(mode==='move') selectFaceAt(px,py);
  else if(mode==='object') selectObjectAt(px,py);
  else if(mode==='ruler') rulerClick(px,py);
  else selectRulerAt(px,py);
});
dom.addEventListener('pointermove', e=>{
  if(marquee){ const r=dom.getBoundingClientRect(); moveMarquee(e.clientX-r.left, e.clientY-r.top); return; }
  if(mode==='draw'){ drawMoveEvt(e); return; }
  if(mode==='ruler' && rulerPhase===1){ const r=dom.getBoundingClientRect(); updatePreview(e.clientX-r.left, e.clientY-r.top); }
});
dom.addEventListener('contextmenu', e=>{
  if(mode==='draw'){ e.preventDefault(); setCutAdd(drawMode==='cut'?'add':'cut'); }
});
window.addEventListener('keydown', e=>{
  if(/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
  const mod=e.ctrlKey||e.metaKey;
  const k=e.key.toLowerCase();
  if(mod){
    if(k==='z' && !e.shiftKey){ undo(); e.preventDefault(); }
    else if((k==='z' && e.shiftKey) || k==='y'){ redo(); e.preventDefault(); }
    else if(k==='c'){ copyObject(); e.preventDefault(); }
    else if(k==='x'){ cutObject(); e.preventDefault(); }
    else if(k==='v'){ pasteObject(); e.preventDefault(); }
    else if(k==='d'){ copyObject(); pasteObject(); e.preventDefault(); }  // duplicate
    else if(k==='i'){ invertShape(); e.preventDefault(); }
    return;
  }
  if(k==='m') setMode('move');
  else if(k==='o') setMode('object');
  else if(k==='r') setMode('draw');
  else if(k==='k') setMode('ruler');
  else if(e.key==='Enter'){ if(mode==='draw' && drawStage===3){ applyDraw(); e.preventDefault(); } }
  else if(e.key==='Escape'){ if(mode==='draw' && drawStage!==0) cancelDraw(); else setMode('view'); }
  else if(e.key==='Delete'||e.key==='Backspace'){
    if(mode==='draw' && drawStage!==0){ cancelDraw(); e.preventDefault(); }
    else if(selection && selection.kind==='object'){ deleteSelectedObject(); e.preventDefault(); }
    else if(selectedRuler){ deleteSelectedRuler(); e.preventDefault(); } }
});

// called from displayGeometry after a new model loads
function onModelLoaded(size){ clearSelection(); clearAllRulers(); setMode('view'); }

function animate(){
  requestAnimationFrame(animate);
  if(camAnim){
    camAnim.t=Math.min(1, camAnim.t+0.07); const e=camAnim.t*camAnim.t*(3-2*camAnim.t);
    camera.position.lerpVectors(camAnim.fp, camAnim.tp, e);
    controls.target.lerpVectors(camAnim.ft, camAnim.tt, e);
    camera.lookAt(controls.target);
    if(camAnim.t>=1){ camAnim=null; controls.update(); }
  } else controls.update();
  renderer.render(scene, camera);
  updateLabels();
}
animate();

// remember the last-loaded file in localStorage and restore it next visit
function saveLast(buffer, filename){
  try{
    if(!buffer || buffer.byteLength>4*1024*1024){ return; }   // don't cache big files
    const bytes=new Uint8Array(buffer); let bin=''; const CH=0x8000;
    for(let i=0;i<bytes.length;i+=CH) bin+=String.fromCharCode.apply(null, bytes.subarray(i,i+CH));
    localStorage.setItem('3dpt_last', JSON.stringify({name:filename, b64:btoa(bin)}));
  }catch(e){ /* quota / private mode — ignore */ }
}
function loadLast(){
  try{
    const s=localStorage.getItem('3dpt_last'); if(!s) return false;
    const {name,b64}=JSON.parse(s); const bin=atob(b64); const arr=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
    loadArrayBuffer(arr.buffer, name); toast('Reopened your last file: '+name); return true;
  }catch(e){ return false; }
}

// ---------- save the current (edited) mesh as .3mf / .stl ----------
function geoToArrays(geo){
  const g=geo.index?geo.toNonIndexed():geo; const p=g.getAttribute('position');
  const verts=[], tris=[], map=new Map();
  const idx=k=>{ const x=p.getX(k),y=p.getY(k),z=p.getZ(k);
    const key=x.toFixed(4)+'_'+y.toFixed(4)+'_'+z.toFixed(4); let id=map.get(key);
    if(id===undefined){ id=verts.length/3; verts.push(x,y,z); map.set(key,id); } return id; };
  for(let k=0;k<p.count;k+=3) tris.push(idx(k),idx(k+1),idx(k+2));
  return {verts,tris};
}
function build3MF(geo){
  const {verts,tris}=geoToArrays(geo);
  let v=''; for(let i=0;i<verts.length;i+=3) v+=`<vertex x="${verts[i]}" y="${verts[i+1]}" z="${verts[i+2]}"/>`;
  let t=''; for(let i=0;i<tris.length;i+=3) t+=`<triangle v1="${tris[i]}" v2="${tris[i+1]}" v3="${tris[i+2]}"/>`;
  const model=`<?xml version="1.0" encoding="UTF-8"?>
<model unit="millimeter" xml:lang="en-US" xmlns="http://schemas.microsoft.com/3dmanufacturing/core/2015/02">
<resources><object id="1" type="model"><mesh><vertices>${v}</vertices><triangles>${t}</triangles></mesh></object></resources>
<build><item objectid="1"/></build></model>`;
  const ct=`<?xml version="1.0" encoding="UTF-8"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="model" ContentType="application/vnd.ms-package.3dmanufacturing-3dmodel+xml"/></Types>`;
  const rels=`<?xml version="1.0" encoding="UTF-8"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Target="/3D/3dmodel.model" Id="rel0" Type="http://schemas.microsoft.com/3dmanufacturing/2013/01/3dmodel"/></Relationships>`;
  return new Blob([zipSync({'[Content_Types].xml':strToU8(ct),'_rels/.rels':strToU8(rels),'3D/3dmodel.model':strToU8(model)},{level:6})],{type:'model/3mf'});
}
function stlBlob(geo){
  const g=geo.index?geo.toNonIndexed():geo; const p=g.getAttribute('position'); const nTri=p.count/3;
  const buf=new ArrayBuffer(84+nTri*50), dv=new DataView(buf); let off=84; dv.setUint32(80,nTri,true);
  const A=new THREE.Vector3(),B=new THREE.Vector3(),C=new THREE.Vector3(),n=new THREE.Vector3();
  for(let i=0;i<p.count;i+=3){ A.fromBufferAttribute(p,i);B.fromBufferAttribute(p,i+1);C.fromBufferAttribute(p,i+2); faceNormal(A,B,C,n);
    dv.setFloat32(off,n.x,true);dv.setFloat32(off+4,n.y,true);dv.setFloat32(off+8,n.z,true); off+=12;
    for(const v of [A,B,C]){ dv.setFloat32(off,v.x,true);dv.setFloat32(off+4,v.y,true);dv.setFloat32(off+8,v.z,true); off+=12; }
    dv.setUint16(off,0,true); off+=2; }
  return new Blob([buf],{type:'model/stl'});
}
function download(blob,name){ const u=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=u; a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(u),2000); }
document.getElementById('save3mf').onclick=()=>{ if(!currentGeometry){ toast('Load a mesh first (G-code has no mesh to save)',true); return; }
  download(build3MF(currentGeometry), currentName+'_edited.3mf'); toast('Saved '+currentName+'_edited.3mf'); };
document.getElementById('savestl').onclick=()=>{ if(!currentGeometry){ toast('Load a mesh first (G-code has no mesh to save)',true); return; }
  download(stlBlob(currentGeometry), currentName+'_edited.stl'); toast('Saved '+currentName+'_edited.stl'); };

// ---------- inverse (negative) + axis chops (CSG) ----------
function replaceGeo(ng){ ng.computeVertexNormals(); ng.computeBoundingBox();
  currentMesh.geometry.dispose(); currentMesh.geometry=ng; currentGeometry=ng;
  clearSelection(); updateDims(); updateTris(); }
function csgResult(aGeo,bGeo,op){ const A=new Brush(aGeo),B=new Brush(bGeo);
  A.updateMatrixWorld(); B.updateMatrixWorld(); return csgEval.evaluate(A,B,op).geometry.clone(); }
function invertShape(){
  if(!currentGeometry){ toast('Load a mesh first (G-code has no mesh)',true); return; }
  pushUndo();
  try{
    currentGeometry.computeBoundingBox(); const b=currentGeometry.boundingBox;
    const s=new THREE.Vector3(); b.getSize(s); const c=new THREE.Vector3(); b.getCenter(c);
    const pad=Math.max(s.x,s.y,s.z)*0.12;
    const box=new THREE.BoxGeometry(s.x+2*pad,s.y+2*pad,s.z+2*pad).translate(c.x,c.y,c.z);
    replaceGeo(csgResult(box,currentGeometry,SUBTRACTION));
    toast('Inverse (negative) block created — '+fmt(currentGeometry.getAttribute('position').count/3)+' tris');
  }catch(e){ console.error(e); toast('Inverse failed: '+e.message,true); undo(); }
}
function chopAt(axis, keepPositive){
  if(!currentGeometry){ toast('Load a mesh first',true); return; }
  pushUndo();
  try{
    currentGeometry.computeBoundingBox(); const b=currentGeometry.boundingBox;
    const s=new THREE.Vector3(); b.getSize(s); const c=new THREE.Vector3(); b.getCenter(c);
    const pad=Math.max(s.x,s.y,s.z)*0.1+1;
    const dim=new THREE.Vector3(s.x+2*pad,s.y+2*pad,s.z+2*pad);
    const dc=c.clone(); const dsize=s[axis]/2+pad; dim[axis]=dsize;
    dc[axis]= keepPositive ? c[axis]-dsize/2 : c[axis]+dsize/2;   // discard the far half
    const box=new THREE.BoxGeometry(dim.x,dim.y,dim.z).translate(dc.x,dc.y,dc.z);
    replaceGeo(csgResult(currentGeometry,box,SUBTRACTION));
    toast('Chopped at '+axis.toUpperCase()+' centre — kept the '+(keepPositive?'+':'−')+' half (flush)');
  }catch(e){ console.error(e); toast('Chop failed: '+e.message,true); undo(); }
}
document.getElementById('inverse').onclick=invertShape;
document.getElementById('chop').addEventListener('change',e=>{ const v=e.target.value; e.target.value='';
  if(v) chopAt(v[0], v[1]==='+'); });

// preload: ?model=<url> wins; else your last-opened file; else the bundled sample
const _q=new URLSearchParams(location.search).get('model');
if(_q) loadFromURL(_q);
else if(!loadLast()) loadFromURL('samples/2x2_ver1.3mf');
</script>
